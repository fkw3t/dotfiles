include lackluster.conf

include shell_integration.conf
include clipboard_control.conf

font_size 20.0

font_family      family="JetBrains Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto

cursor_shape block
cursor_blink_interval 500

mouse_hide_wait 3.0
mouse_map ctrl+c copy_to_clipboard
mouse_map ctrl+v paste_from_clipboard
paste_with_middle_click yes

shell zsh
shell_args --login

dynamic_title yes
remember_window_size yes
initial_window_width 160c
initial_window_height 80c
tab_bar_style powerline
inactive_window_opacity 0.8
